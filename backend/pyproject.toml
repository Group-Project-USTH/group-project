[project]
name = "maintainability-lens"
version = "0.1.0"
description = "A DeepAgents agent that evaluates ISO/IEC 25010 maintainability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "complexipy>=8.3.0,<9",
    "lizard>=1.26.0,<2",
    "mcp>=2.3.0,<3",
    "pydantic>=2.14.3,<3",
]

[project.scripts]
maintainability-lens = "maintainability_lens.cli:main"

[dependency-groups]
# The DeepAgents agent, API and tracing stay for the evaluation baseline (ADR 0001), but
# are not installed with the CLI.
agent = [
    "deepagents>=0.7.37,<0.8",
    "fastapi>=0.162.5,<0.166",
    "langchain>=1.4.6,<2",
    "langchain-openai>=1.7.4,<2",
    "langfuse>=5.2.0,<6",
    "pydantic-settings>=2.16.2,<3",
    "uvicorn>=0.54.0,<0.55",
]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
default-groups = ["dev", "agent"]
# Why: the plugin starts the server with `uvx --from backend`, which by default rebuilds only
# when pyproject.toml changes, so it would keep serving stale source.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

# lizard ships no type hints or py.typed marker.
[[tool.mypy.overrides]]
module = ["lizard"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration' --cov=maintainability_lens --cov-report=term-missing"
markers = ["integration: needs real LLM/Langfuse credentials; run with `-m integration`"]
norecursedirs = ["fixtures"]

[tool.coverage.run]
branch = true

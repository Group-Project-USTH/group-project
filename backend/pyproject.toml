[project]
name = "maintainability-agent"
version = "0.1.0"
description = "A DeepAgents agent that evaluates ISO/IEC 25010 maintainability."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.28,<0.8",
    "fastapi>=0.148.0,<0.149",
    "langchain>=1.4.6,<2",
    "langchain-openai>=1.7.2,<2",
    "langfuse>=5.0.2,<6",
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "uvicorn>=0.54.0,<0.55",
]

[project.scripts]
maintainability-agent = "maintainability_agent.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration' --cov=maintainability_agent --cov-report=term-missing"
markers = ["integration: needs real LLM/Langfuse credentials; run with `-m integration`"]
norecursedirs = ["fixtures"]

[tool.coverage.run]
branch = true
